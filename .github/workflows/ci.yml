name: .NET 10 CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build, test, and pack
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Calculate version
        id: version
        # GitVersion 5 supports the repository's Mainline configuration.
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP gitversion
          dotnet tool install GitVersion.Tool --version 5.12.0 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & (Join-Path $toolPath dotnet-gitversion.exe) /showvariable SemVer /verbosity Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "GitVersion did not return a semantic version."
          }
          "semver=$version" >> $env:GITHUB_OUTPUT

      - name: Build solution
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semver }}
        run: dotnet build NBi.sln -c Release -p:ContinuousIntegrationBuild=true "-p:Version=$env:PACKAGE_VERSION"


      - name: Check C# code analysis
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main HEAD)
          fi
          bash .githooks/check-code-analysis "$base" HEAD

      - name: Set up the Excel OLE DB provider
        timeout-minutes: 12
        run: |
          function Test-ExcelProvider {
            $providers = powershell.exe -NoProfile -NonInteractive -Command {
              Add-Type -AssemblyName System.Data
              (New-Object System.Data.OleDb.OleDbEnumerator).GetElements() |
                ForEach-Object { $_.SOURCES_NAME }
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not enumerate the Windows OLE DB providers." }
            return $providers -contains 'Microsoft.ACE.OLEDB.16.0'
          }

          if (Test-ExcelProvider) {
            Write-Host 'Microsoft.ACE.OLEDB.16.0 is already available.'
            exit 0
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'access-runtime'
          New-Item -ItemType Directory -Path $installDir | Out-Null
          $installer = Join-Path $installDir 'officedeploymenttool.exe'
          $odtUri = 'https://download.microsoft.com/download/6c1eeb25-cf8b-41d9-8d0d-cc1dbc032140/officedeploymenttool_20527-20150.exe'
          Invoke-WebRequest -Uri $odtUri -OutFile $installer -MaximumRetryCount 3
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '28bc762075c758b5ef841fe94487565168deeed59f78ded5d5dfdfb08a9e827a') {
            throw "The Office Deployment Tool checksum did not match."
          }

          $extract = Start-Process -FilePath $installer -ArgumentList '/quiet', "/extract:`"$installDir`"" -WorkingDirectory $installDir -WindowStyle Hidden -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw "Office Deployment Tool extraction failed ($($extract.ExitCode))." }

          $configuration = Join-Path $installDir 'access-runtime.xml'
          @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="AccessRuntimeRetail">
                <Language ID="en-us" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
          </Configuration>
          '@ | Set-Content -LiteralPath $configuration

          $setup = Start-Process -FilePath (Join-Path $installDir 'setup.exe') -ArgumentList '/configure', "`"$configuration`"" -WorkingDirectory $installDir -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Microsoft 365 Access Runtime installation failed ($($setup.ExitCode))." }
          if (-not (Test-ExcelProvider)) { throw "Microsoft.ACE.OLEDB.16.0 is unavailable after installation." }
          Write-Host 'Microsoft.ACE.OLEDB.16.0 is available.'

      - name: Run .NET 10 tests
        run: |
          $results = Join-Path $env:RUNNER_TEMP nbi-test-results
          $projects = @(
            'NBi.Testing.Core/NBi.Core.Testing.csproj'
            'NBi.Testing.GenbiL/NBi.GenbiL.Testing.csproj'
            'NBi.Testing.Xml/NBi.Xml.Testing.csproj'
            'NBi.Testing.Framework/NBi.Framework.Testing.csproj'
          )
          $failed = $false
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            $projectResults = Join-Path $results $name
            dotnet test $project -c Release --framework net10.0 --no-build --no-restore `
              --logger "trx;LogFileName=$name.trx" --results-directory $projectResults `
              --collect 'XPlat Code Coverage;Format=opencover'
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              continue
            }
            $reports = @(Get-ChildItem -LiteralPath $projectResults -Depth 1 -Filter coverage.opencover.xml -File)
            if ($reports.Count -ne 1) {
              Write-Host "::error::Expected one OpenCover report for $name, found $($reports.Count)."
              $failed = $true
              continue
            }
            [xml]$coverage = Get-Content -LiteralPath $reports[0].FullName -Raw
            $summary = $coverage.CoverageSession.Summary
            $total = [long]$summary.numSequencePoints
            $visited = [long]$summary.visitedSequencePoints
            if ($name -eq 'NBi.Framework.Testing') {
              # The Core, GenbiL, and XML gates already measure NBi.Model.
              $points = '/CoverageSession/Modules/Module[ModuleName != "NBi.Model"]//SequencePoint'
              $total = $coverage.SelectNodes($points).Count
              $visited = $coverage.SelectNodes("$points[@vc > 0]").Count
            }
            if ($total -eq 0 -or $visited * 100 -lt $total * 10) {
              Write-Host "::error::$name covered $visited of $total sequence points, below 10%."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          exit 0

      - name: Upload test results and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/nbi-test-results

      - name: Pack NuGet packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.semver }}
        run: |
          $packages = Join-Path $env:RUNNER_TEMP nbi-packages
          foreach ($project in 'NBi.Extensibility', 'NBi.Model', 'NBi.Core', 'NBi.CSharp', 'NBi.Framework') {
            dotnet pack $project -c Release --no-build --include-symbols `
              "-p:Version=$env:PACKAGE_VERSION" --output $packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/nbi-packages
          if-no-files-found: error

  publish:
    name: Publish to NuGet.org
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NUGET_USER != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for package in packages/NBi.Extensibility.*.nupkg packages/NBi.Model.*.nupkg packages/NBi.[0-9]*.nupkg packages/NBi.CSharp.*.nupkg packages/NBi.Framework.*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
